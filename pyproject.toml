[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robofael"
version = "3.9.0"
description = "Assistente pessoal de atividades diárias com avatar animado que ouve e responde por voz"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rafael Lourenço" }]
dependencies = [
    "anthropic>=2.0",
    "SpeechRecognition>=3.10",
    "PyAudio>=0.2.13",
    "pygame>=2.5",
    "numpy>=1.26",
    "pillow>=10.2",
    "edge-tts>=6.1",
    "gTTS>=2.5",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
robofael = "robofael.apresentacao.app:main"
robofael-gravar-voz = "robofael.apresentacao.gravador:main"
# nomes antigos (até a 3.4.0), mantidos como alternativa
eurobo = "robofael.apresentacao.app:main"
eurobo-gravar-voz = "robofael.apresentacao.gravador:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = ["lento: renderiza imagens ou abre a interface (alguns segundos)"]
filterwarnings = [
    # avisos de dependências de terceiros, fora do nosso controle
    "ignore::DeprecationWarning:pygame.*",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:speech_recognition.*",
]

[tool.coverage.run]
source = ["robofael"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 80  # RNF21: cobertura mínima de linhas e ramificações
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Clean code verificado no CI: complexidade ciclomática <= 10 (C90), funções curtas (PLR09xx),
# nomes no padrão (N), nada de parâmetro morto (ARG), além de bugs comuns (B) e simplificações (SIM).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF100", "C90", "N", "ARG", "PIE",
          "PLR0911", "PLR0912", "PLR0915"]
ignore = [
    "E741",   # `l` para lembrete é o nome do domínio
    "SIM105", # try/except/pass é mais explícito que contextlib.suppress aqui
    "N818",   # exceções com nomes do domínio em português (TarefaNaoEncontrada, TransicaoInvalida)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Dublês de teste implementam contratos inteiros mesmo sem usar todos os argumentos
"tests/*" = ["ARG", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["robofael", "conftest"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true  # toda função tem assinatura tipada
disallow_incomplete_defs = true
