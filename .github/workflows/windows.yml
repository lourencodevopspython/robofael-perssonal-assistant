name: Windows

# Gera o executável do Windows num runner Windows (o PyInstaller não compila para outro sistema).
# Tag v* (ex.: v3.10.0): anexa o instalador e o pacote portátil à release da tag.
# Aba Actions → Windows → Run workflow, ou um push na main que mexa no empacotamento: deixa os arquivos como
# artefato da execução.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "empacotamento/windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executavel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Testes do Windows (registro, atalhos, microfones, pastas)
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_windows.py -v
      - name: Construir
        shell: pwsh
        run: |
          Start-Transcript -Path build.log | Out-Null
          try {
            ./empacotamento/windows/construir.ps1
          } catch {
            Stop-Transcript | Out-Null
            # O final do log vira uma anotação do job: aparece no resumo da execução (o log completo pede login)
            $fim = (Get-Content build.log -Tail 60) -join "`n"
            $mensagem = "$($_.Exception.Message)`n$fim".Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=Falha ao construir o executável::$mensagem"
            exit 1
          }
          Stop-Transcript | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: Robofael-windows
          path: |
            dist/windows/*.zip
            dist/windows/*-Instalador.exe
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/*.zip
            dist/windows/*-Instalador.exe
