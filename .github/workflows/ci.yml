name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dependências do sistema (PortAudio, Tk, servidor gráfico virtual)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev python3-tk xvfb
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tipos
        run: mypy
      - name: Testes
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a pytest --cov --cov-report=term-missing
